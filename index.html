<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Start Game ♡ Reiru</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ===== VARIABEL WARNA (Sesuai Profile) ===== */
:root {
  --bg-sky-top: #021842;
  --bg-sky-bot: #0a45a1;
  --building-far: #063478;
  --building-near: #005eff;
  --accent: #4d7cff;
  --white: #ffffff;
  --shadow: rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

body {
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: linear-gradient(180deg, var(--bg-sky-top), var(--bg-sky-bot));
  font-family: 'Press Start 2P', monospace;
  color: var(--white);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* ===== LAYERS BACKGROUND (SCROLLING CITY) ===== */
.layer {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* Gedung Jauh (Lambat) */
.city-far {
  background-image: 
    linear-gradient(transparent 85%, var(--building-far) 85%),
    repeating-linear-gradient(90deg, var(--building-far) 0px, var(--building-far) 30px, transparent 30px, transparent 60px);
  background-size: 100% 100%;
  height: 40%;
  opacity: 0.6;
  animation: scrollCity 20s linear infinite;
}

/* Gedung Dekat (Cepat) - Dibuat dengan CSS Gradient agar ringan */
.city-near {
  height: 25%;
  background: 
    linear-gradient(to top, var(--building-near) 0%, var(--building-near) 100%);
  /* Pola kotak-kotak seperti jendela gedung */
  mask-image: 
    linear-gradient(to right, 
      black 0%, black 15%, transparent 15%, transparent 20%, 
      black 20%, black 45%, transparent 45%, transparent 50%,
      black 50%, black 70%, transparent 70%, transparent 75%,
      black 75%, black 100%
    );
  mask-size: 300px 100%; 
  -webkit-mask-image: 
     linear-gradient(to right, 
      black 0%, black 15%, transparent 15%, transparent 20%, 
      black 20%, black 45%, transparent 45%, transparent 50%,
      black 50%, black 70%, transparent 70%, transparent 75%,
      black 75%, black 100%
    );
  -webkit-mask-size: 300px 100%;
  
  animation: scrollCity 8s linear infinite;
  z-index: 2;
  border-top: 4px solid #8ab6ff; /* Highlight atap */
}

/* Animasi Bergerak ke Kiri */
@keyframes scrollCity {
  from { background-position-x: 0px; -webkit-mask-position-x: 0px; }
  to { background-position-x: -300px; -webkit-mask-position-x: -300px; }
}

/* ===== CLOUDS (Generated by JS) ===== */
.cloud {
  position: absolute;
  background: var(--white);
  opacity: 0.8;
  border-radius: 4px;
  box-shadow: 
    8px 0 0 0 var(--white),
    -8px 0 0 0 var(--white),
    0 -8px 0 0 var(--white),
    0 8px 0 0 var(--white); /* Efek Pixel */
  animation: floatCloud linear infinite;
  z-index: 0;
}

@keyframes floatCloud {
  from { transform: translateX(100vw); }
  to { transform: translateX(-150px); }
}

/* ===== UI CONTAINER ===== */
.ui-container {
  z-index: 10;
  text-align: center;
  position: relative;
  animation: floatUp 1s ease-out;
}

.title-box {
  margin-bottom: 40px;
}

h1 {
  font-size: 35px;
  color: #d5e002; /* Kuning retro */
  text-shadow: 4px 4px 0 #000;
  line-height: 1.5;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 10px;
  color: #8ab6ff;
  letter-spacing: 2px;
  animation: blink 1s steps(2) infinite;
}

/* ===== PIXEL BUTTON ===== */
.btn-wrapper {
  position: relative;
  display: inline-block;
}

.enter-btn {
  background: #ffffff;
  color: #005eff;
  border: 4px solid #005eff;
  padding: 15px 30px;
  font-family: 'Press Start 2P', monospace;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 
    6px 6px 0 #003cff,
    inset -4px -4px 0 rgba(0,0,0,0.1);
  transition: transform 0.1s, box-shadow 0.1s;
  text-decoration: none;
  display: inline-block;
  position: relative;
}

/* Arrow Decoration */
.enter-btn::before {
  content: "►";
  position: absolute;
  left: 10px;
  opacity: 0;
  transition: opacity 0.2s;
}

.enter-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 #003cff;
  padding-left: 40px; /* Geser teks dikit */
}

.enter-btn:hover::before {
  opacity: 1;
}

.enter-btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0px 0px 0 #003cff;
  background: #e6f0ff;
}

/* ===== ANIMASI TRANSISI ===== */
@keyframes blink { 0% {opacity:1} 50% {opacity:0} 100% {opacity:1} }
@keyframes floatUp { from {transform: translateY(50px); opacity:0;} to {transform:translateY(0); opacity:1;} }

/* Layar Hitam Transisi */
#fadeOverlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  z-index: 999;
}

/* Versi HP */
@media (max-width: 600px) {
  h1 { font-size: 20px; }
  .city-near { mask-size: 150px 100%; -webkit-mask-size: 150px 100%; }
}
</style>
</head>
<body>

  <audio id="sfxClick" src="Klik.mp3"></audio>

  <div id="cloudContainer"></div> <div class="layer city-far"></div>
  <div class="layer city-near"></div>
  
  <div class="layer" style="background: linear-gradient(transparent 95%, #001f52 95%); z-index: 3;"></div> <div class="ui-container">
    <div class="title-box">
      <h1>REIRU'S<br>WORLD</h1>
      <p class="subtitle">- PRESS START TO CONNECT -</p>
    </div>

    <div class="btn-wrapper">
      <button class="enter-btn" onclick="enterWorld()">START GAME</button>
    </div>
  </div>

  <div id="fadeOverlay"></div>

<script>
  // 1. GENERATE PIXEL CLOUDS
  const cloudContainer = document.getElementById('cloudContainer');
  
  function spawnCloud() {
    const cloud = document.createElement('div');
    cloud.classList.add('cloud');
    
    // Random ukuran & posisi
    const size = Math.random() * 20 + 10; // 10px - 30px
    const topPos = Math.random() * 40; // 0% - 40% dari atas
    const duration = Math.random() * 10 + 15; // 15s - 25s speed
    
    cloud.style.width = size * 2 + 'px';
    cloud.style.height = size + 'px';
    cloud.style.top = topPos + '%';
    cloud.style.animationDuration = duration + 's';
    
    // Pixelated box-shadow trick randomizer (biar bentuk awan beda2 dikit)
    cloud.style.boxShadow = `
      ${size/2}px -${size/2}px 0 0 white,
      -${size/2}px ${size/3}px 0 0 white
    `;

    cloudContainer.appendChild(cloud);

    // Hapus awan setelah lewat layar
    setTimeout(() => {
      cloud.remove();
    }, duration * 1000);
  }

  // Spawn awan setiap 2.5 detik
  setInterval(spawnCloud, 2500);
  // Spawn 3 awan awal biar ga sepi
  spawnCloud(); spawnCloud(); spawnCloud();


  // 2. FUNGSI KLIK & TRANSISI
  function enterWorld() {
    const sfx = document.getElementById('sfxClick');
    const overlay = document.getElementById('fadeOverlay');
    const btn = document.querySelector('.enter-btn');

    // Ubah teks tombol jadi loading
    btn.innerHTML = "LOADING...";
    
    // Mainkan suara (Reset dulu biar kalau spam klik tetep bunyi)
    sfx.currentTime = 0;
    sfx.volume = 0.5;
    sfx.play().catch(e => console.log("Audio play failed:", e));

    // Animasi Layar Gelap
    overlay.style.opacity = '1';

    // Pindah halaman setelah 0.8 detik (tunggu suara & efek)
    setTimeout(() => {
      window.location.href = 'profile.html';
    }, 800);
  }
</script>

</body>
</html>
