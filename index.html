<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Enter ♡ Reiru</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --blue1:#7db7ff;
  --blue2:#9ed4ff;
  --blue3:#5b8dff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #f6fbff, #eef5ff);
  display: flex;
  justify-content: center;
  align-items: center;
  body {
  font-family: 'M PLUS Rounded 1c', sans-serif;
}
  overflow: hidden;
}

/* ===== FLOATING CUTE ===== */
.float {
  position: absolute;
  bottom: -40px;
  font-size: 18px;
  opacity: .55;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0%   { transform: translateY(0); opacity: 0; }
  10%  { opacity: .55; }
  80%  { opacity: .55; }
  100% { transform: translateY(-70vh); opacity: 0; }
}

/* ===== CENTER CONTENT ===== */
.container {
  text-align: center;
  z-index: 2;
}

.title {
  font-size: 24px;
  font-weight: 700;
  color: #6fa9ff;
  margin-bottom: 24px;
  letter-spacing: 1px;
}

/* ===== ENTER BUTTON ===== */
.enter-btn {
  position: relative;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 210px;
  height: 62px;

  font-size: 20px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #ffffff;

  background:
    linear-gradient(135deg, #8fc6ff, #6fa9ff);

  border-radius: 18px;
  text-decoration: none;

  box-shadow:
    0 10px 0 #5b8dff,
    0 20px 35px rgba(111,169,255,.45);

  transform: translateY(0);
  transition: all .2s ease;
}

/* idle cute pulse */
.enter-btn {
  animation: softPulse 2.6s ease-in-out infinite;
}

@keyframes softPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

.enter-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 20px 50px rgba(125,183,255,.6);
}

/* ===== CUTE GLITCH (MICRO) ===== */
.enter-btn::before,
.enter-btn::after {
  content: "ENTER";
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
}

.enter-btn::before {
  color: #e8f6ff;
  transform: translateX(-1px);
}

.enter-btn::after {
  color: #cfe8ff;
  transform: translateX(1px);
  content: "";
  position: absolute;
  inset: 4px;
  border: 2px dashed rgba(255,255,255,.45);
  border-radius: 14px;
  pointer-events: none;
}
}

.enter-btn.glitch::before,
.enter-btn.glitch::after {
  opacity: 1;
  animation: cuteGlitch .12s linear infinite;
}

@keyframes cuteGlitch {
  0%   { transform: translate(0); }
  50%  { transform: translate(1px,-1px); }
  100% { transform: translate(0); }
}
.enter-btn:active {
  transform: translateY(6px);
  box-shadow:
    0 4px 0 #5b8dff,
    0 10px 20px rgba(111,169,255,.4);
}

/* small helper text */
.hint {
  margin-top: 14px;
  font-size: 13px;
  font-weight: 500;
  opacity: .65;
  letter-spacing: .5px;
}
}
#anime-transition {
  position: fixed;
  inset: 0;
  background: #f7fbff;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
}
.flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
}
@keyframes animeFlash {
  0% { opacity: 0; }
  20% { opacity: 1; }
  100% { opacity: 0; }
}
}
@keyframes animeSlide {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-100%);
  }
}
</style>
</head>

<body>

<!-- floating icons (blue-ish only) -->
<div class="float" style="left:10%; animation-duration:12s;">💙</div>
<div class="float" style="left:25%; animation-duration:10s;">✦</div>
<div class="float" style="left:40%; animation-duration:14s;">❄️</div>
<div class="float" style="left:60%; animation-duration:11s;">☆</div>
<div class="float" style="left:75%; animation-duration:13s;">♡</div>
<div class="float" style="left:90%; animation-duration:15s;">✧</div>

<div class="container">
<div class="title">Welcome to Reiru's Page ♡</div>
  <a href="profil.html" class="enter-btn" id="enterBtn">ENTER</a>
  <div class="hint">tap to continue</div>
</div>

<div id="anime-transition">
  <div class="flash"></div>
</div>

<script>
const btn = document.getElementById("enterBtn");

/* cute glitch tiap 4 detik */
setInterval(() => {
  btn.classList.add("glitch");
  setTimeout(() => btn.classList.remove("glitch"), 160);
}, 4000);

const enterBtn = document.getElementById("enterBtn");
const transition = document.getElementById("anime-transition");
const flash = document.querySelector(".flash");

enterBtn.addEventListener("click", (e) => {
  e.preventDefault();

  // Aktifkan overlay
  transition.style.opacity = "1";

  // Flash cepat
  flash.style.animation = "animeFlash 0.35s ease-out";

  // Zoom halaman
  document.body.style.animation = "animeZoom 0.6s ease-in-out forwards";

  // Delay cut ala anime
  setTimeout(() => {
    transition.style.animation = "animeSlide 0.7s ease-in forwards";
  }, 300);

  // Pindah halaman
  setTimeout(() => {
    window.location.href = "profil.html";
  }, 900);
});
</script>

</body>
</html>
