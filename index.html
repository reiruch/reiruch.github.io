<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>

    * {
  box-sizing: border-box;
  font-family: 'Nunito', sans-serif;
  line-height: 1.6;
}

}
    body {
      background: #eaf3ff;
      margin: 0;
      padding: 30px 0;
      color: #2c2c2c;
    }

    .page {
  max-width: 360px;
  margin: auto;
  background: #f7fbff;
  border: 2px solid #b8d8ff;
  border-radius: 14px;
  padding: 18px;
}

    .topbar {
      font-size: 13px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      color: #4b7bbd;
    }

    .profile {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #9fc7ff;
    }

    .profile h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    .profile p {
  font-size: 13px;
  margin: 0;
  line-height: 1.6;
}.profile img {
  transition: 0.3s ease;
}

.profile img:hover {
  transform: scale(1.05);
}

.box {
  background: #eef6ff;
  border: 1.5px solid #c5ddff;
  border-radius: 10px;
  padding: 12px;
  margin-top: 14px;
  font-size: 13px;
}

.box:hover {
  transform: translateY(-2px);
  background: #3bebff;
}

    .box h2 {
  font-size: 13px;
  margin: 0 0 6px;
  color: #4b7bbd;
  display: flex;
  align-items: center;
  gap: 6px;
}

    .footer {
      text-align: center;
      font-size: 11px;
      color: #7a9cc9;
      margin-top: 14px;
    }
    @keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.page {
  animation: fadeUp 0.6s ease-out;
}
/* ===== CHAOTIC BACKGROUND ===== */
body {
  background: linear-gradient(120deg, #eaf3ff, #f5fdff, #eafff3);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== BOX CHAOS ===== */
.box {
  transition: all 0.25s ease;
}

.box:hover {
  transform: rotate(-1deg) scale(1.02);
  box-shadow: 0 0 12px rgba(100,150,255,0.6);
}

/* ===== FLOATING EMOJI ===== */
.floating {
  position: fixed;
  font-size: 18px;
  opacity: 0.6;
  animation: floatUp 8s linear infinite;
  pointer-events: none;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh) rotate(0deg);
  }
  to {
    transform: translateY(-120px) rotate(360deg);
  }
}

/* ===== NAME GLOW ===== */
.name {
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from {
    text-shadow: 0 0 5px #8ab6ff;
  }
  to {
    text-shadow: 0 0 14px #ffb3ff;
  }
}
/* ===== ANIME GLITCH TEXT ===== */
.glitch {
  position: relative;
  font-weight: 1000;
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
}

.glitch.active::before {
  color: #0ffffb;
  opacity: 1;
  animation: glitchTop 0.3s steps(2);
}

.glitch.active::after {
  color: #ff0f0f;
  opacity: 1;
  animation: glitchBottom 0.3s steps(2);
}
@keyframes glitchTop {
  0% { transform: translate(0); }
  20% { transform: translate(-1px, -1px); }
  40% { transform: translate(-2px, 1px); }
  60% { transform: translate(1px, -1px); }
  80% { transform: translate(2px, 1px); }
  100% { transform: translate(0); }
}

@keyframes glitchBottom {
  0% { transform: translate(0); }
  20% { transform: translate(1px, 1px); }
  40% { transform: translate(2px, -1px); }
  60% { transform: translate(-1px, 1px); }
  80% { transform: translate(-2px, -1px); }
  100% { transform: translate(0); }
}
  </style>
</head>
 
<body>

  <div class="page">

    <div class="topbar">
      <span>🌐 僕のサイト</span>
      <span>Profile | Log Out</span>
      
    </div>


<div class="profile">
  <img src="reii.jpg">
  <div class="profile-text">
   <h1 class="name glitch" data-text="Reiru">Reiru</h1>
    <p class="info">
      He/Him <br>
      20 <br>
      eng / idn
    </p>
  </div>
</div>

<style>
.name {
  font-family: Arial, Sans-Serif;

}

</style>
    <div class="box">
<h2 class="glitch" data-text="✦| About Me">✦| About Me</h2>
  ♡ J-Pop enjoyer<br>

<div class="box">

<p style="text-align:center;font-size:11px;opacity:0.6;">

  </div>
<!-- FLOATING CHAOS -->
<div class="floating" style="left:10%; animation-delay:0s;">⭐</div>
<div class="floating" style="left:30%; animation-delay:2s;">💫</div>

<audio id="clickSound" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_946b7c6c5c.mp3" type="audio/mpeg">
</audio>

<script>
  const clickSound = document.getElementById("clickSound");

  function playClick() {
    clickSound.currentTime = 0;
    clickSound.play().catch(()=>{});
  }

  document.querySelectorAll(".box, .profile img, h2, h1").forEach(el => {
    el.addEventListener("click", playClick);
  });
</script>
</body>

<div class="character-footer">
  <img src="chr.png">
</div>
  <style>
      .character-footer {
  position: relative;
  margin-top: -80px;
  opacity: 0.9;
}

.character-footer img {
  position: absolute;
  right: 1;
  bottom: 9;
  width: 850px;
  max-width: 71.5%;
  margin: 0 auto;
}
.character-footer img {
  transition: transform 1s ease;
}

.character-footer img:hover {
  transform: translateX(-1000px);
}
@keyframes slideInLeft {
  from {
    transform: translateX(-300px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 100;
  }
}

.character-footer img {
  animation: slideInLeft 0.9s ease-out;
}
}
  </style>
  <script>
  const glitchEls = document.querySelectorAll(".glitch");

  setInterval(() => {
    glitchEls.forEach(el => {
      el.classList.add("active");

      setTimeout(() => {
        el.classList.remove("active");
      }, 300);
    });
  }, 3000);
</script>
</html>
