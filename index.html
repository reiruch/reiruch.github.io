<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
  box-sizing: border-box;
  font-family: 'Nunito', sans-serif;
  line-height: 1.6;
}

    body {
      background: #eaf3ff;
      margin: 0;
      padding: 30px 0;
      color: #2c2c2c;
    }

    .page {
  max-width: 360px;
  margin: auto;
  background: #f7fbff;
  border: 2px solid #b8d8ff;
  border-radius: 14px;
  padding: 18px;
}

    .topbar {
      font-size: 13px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      color: #4b7bbd;
    }

    .profile {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #9fc7ff;
    }

    .profile h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    .profile p {
  font-size: 13px;
  margin: 0;
  line-height: 1.6;
}.profile img {
  transition: 0.3s ease;
}

.profile img:hover {
  transform: scale(1.05);
}

.box {
  background: #eef6ff;
  border: 1.5px solid #c5ddff;
  border-radius: 10px;
  padding: 12px;
  margin-top: 14px;
  font-size: 13px;
}

.box:hover {
  transform: translateY(-2px);
  background: #273549;
}

    .box h2 {
  font-size: 13px;
  margin: 0 0 6px;
  color: #4b7bbd;
  display: flex;
  align-items: center;
  gap: 6px;
}

    .footer {
      text-align: center;
      font-size: 11px;
      color: #7a9cc9;
      margin-top: 14px;
    }
    @keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.page {
  animation: fadeUp 0.6s ease-out;
}
  </style>
</head>
<body>

  <div class="page">

    <div class="topbar">
      <span>🌐 僕のサイト</span>
      <span>Profile</span>
    </div>

    <div class="profile">
      <img src="Pp.jpg">
      <div>
        <h1> Reiru </h1>
        <p>
          He/Him • 20 <br>
          artist<br>
          eng / idn
        </p>
      </div>
    </div>


    <div class="box">
  <h2>✦ About Me</h2>
  ♡ J-Pop enjoyer<br>
  ♡ Artisyt <br>
  ♡ random but friendly
</div>

<div class="box">
  <h2>☆ Likes</h2>
  anime • manga • fanart • music • edits
</div>

<div class="box">
  <h2>➤ My Platforms </h2>
  • Ig: frylvdl <br>
  • Yt: reiru_ch
  
</div>

<div class="box">
  <h2>✕ Don’t Follow If</h2>
  toxic • hate speech • drama seeker
</div>

<p style="text-align:center;font-size:11px;opacity:0.6;">
  ── ♡ ──
</p>

  </div>

</body>
</html>
