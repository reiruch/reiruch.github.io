<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Enter ♡ Reiru</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #f6fbff, #eef5ff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
}

/* floating cute icons */
.float {
  position: absolute;
  bottom: -20px;
  font-size: 18px;
  opacity: 0.6;
  animation: floatUp 10s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 0; }
  10% { opacity: .6; }
  80% { opacity: .6; }
  to { transform: translateY(-120vh); opacity: 0; }
}

.container {
  text-align: center;
  z-index: 2;
}

.title {
  font-size: 24px;
  color: #5b8dff;
  margin-bottom: 26px;
}

/* ===== CUTE BUTTON ===== */
.enter-btn {
  position: relative;
  padding: 18px 50px;
  font-size: 20px;
  letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(135deg, #7db7ff, #9ed4ff);
  border-radius: 40px;
  text-decoration: none;
  box-shadow: 0 14px 35px rgba(125,183,255,.45);
  transition: transform .25s ease, box-shadow .25s ease;
}

.enter-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 20px 50px rgba(125,183,255,.6);
}

/* soft pulse idle */
.enter-btn {
  animation: softPulse 2.5s ease-in-out infinite;
}

@keyframes softPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ===== CUTE GLITCH ===== */
.enter-btn::before,
.enter-btn::after {
  content: "ENTER";
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 40px;
  opacity: 0;
  pointer-events: none;
}

.enter-btn::before {
  color: #cce8ff;
  transform: translateX(-1px);
}

.enter-btn::after {
  color: #e6f3ff;
  transform: translateX(1px);
}

.enter-btn.glitch::before,
.enter-btn.glitch::after {
  opacity: 1;
  animation: cuteGlitch .12s linear infinite;
}

@keyframes cuteGlitch {
  0% { transform: translate(0); }
  50% { transform: translate(1px,-1px); }
  100% { transform: translate(0); }
}
</style>
</head>

<body>

<!-- floating icons -->
<div class="float" style="left:10%; animation-delay:0s;">♡</div>
<div class="float" style="left:30%; animation-delay:3s;">✦</div>
<div class="float" style="left:50%; animation-delay:6s;">💙</div>
<div class="float" style="left:70%; animation-delay:1.5s;">☆</div>
<div class="float" style="left:85%; animation-delay:4.5s;">❄️</div>

<div class="container">
  <div class="title">Welcome ♡</div>
  <a href="profile.html" class="enter-btn" id="enterBtn">ENTER</a>
</div>

<script>
const btn = document.getElementById("enterBtn");

// glitch cute tiap 4 detik
setInterval(() => {
  btn.classList.add("glitch");
  setTimeout(() => btn.classList.remove("glitch"), 180);
}, 4000);
</script>

</body>
</html>
